<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="luminate-grad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="luminate-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <g transform="translate(15, 15) scale(0.7)">
    <!-- Central Node -->
    <path d="M50 15 L85 35 L85 75 L50 95 L15 75 L15 35 Z" fill="url(#luminate-grad)" />
    
    <!-- Inner Spark / Light -->
    <path d="M50 35 L67.32 45 L67.32 65 L50 75 L32.68 65 L32.68 45 Z" fill="url(#luminate-grad-light)" />
    
    <!-- Glowing core -->
    <circle cx="50" cy="55" r="8" fill="#ffffff" />
    
    <!-- Connecting nodes -->
    <circle cx="50" cy="15" r="4" fill="#ffffff" />
    <circle cx="85" cy="35" r="4" fill="#ffffff" />
    <circle cx="85" cy="75" r="4" fill="#ffffff" />
    <circle cx="50" cy="95" r="4" fill="#ffffff" />
    <circle cx="15" cy="75" r="4" fill="#ffffff" />
    <circle cx="15" cy="35" r="4" fill="#ffffff" />
  </g>
</svg>
