<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="luminate-grad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="luminate-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <g>
    <!-- Central Node -->
    <path d="M50 10 L85 30 L85 70 L50 90 L15 70 L15 30 Z" fill="url(#luminate-grad)" />
    
    <!-- Inner Spark / Light -->
    <path d="M50 30 L67.32 40 L67.32 60 L50 70 L32.68 60 L32.68 40 Z" fill="url(#luminate-grad-light)" />
    
    <!-- Core -->
    <circle cx="50" cy="50" r="6" fill="#FFFFFF" />
    
    <!-- Connecting nodes -->
    <circle cx="50" cy="10" r="4" fill="#ffffff" />
    <circle cx="85" cy="30" r="3" fill="#ffffff" />
    <circle cx="85" cy="70" r="3" fill="#ffffff" />
    <circle cx="50" cy="90" r="4" fill="#ffffff" />
    <circle cx="15" cy="70" r="3" fill="#ffffff" />
    <circle cx="15" cy="30" r="3" fill="#ffffff" />
  </g>
</svg>
